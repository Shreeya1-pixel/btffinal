services:
  redis:
    image: redis:7-alpine
    container_name: neuroverse-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - neuroverse-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: neuroverse-backend
    ports:
      - "8000:8000"
    environment:
      - LLM_INFERENCE_MODE=${LLM_INFERENCE_MODE:-cloud}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - neuroverse-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: neuroverse-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - neuroverse-network
    restart: unless-stopped

volumes:
  redis-data:

networks:
  neuroverse-network:
    driver: bridge

